# Python 검사기 자체 시험을 지원 플랫폼 전부에서 돌린다. scripts/toolchain.py setup 이 잠금 파일의 해당 플랫폼 항목으로
# Python·uv·의존성을 받고, 같은 실행기로 시험을 돌린다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tool adapter response contract
        run: python3 -I -B tests/test_tool_adapter.py
      - name: Restore the sealed toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: py-toolchain-${{ matrix.os }}-${{ hashFiles('toolchain.lock.json', 'uv.lock', 'pyproject.toml') }}
      - name: Bootstrap the checker (locked Python, uv and dependencies)
        run: python3 -I -B scripts/toolchain.py setup
      - name: Run the checker's tests
        run: python3 -I -B scripts/toolchain.py run python -B -m unittest discover -s tests -v
